reward:
  version: enterprise-native-state-change-v1
  historical_nasim_equivalence: false
  combination: exclusive branches, not additive; failure precedes no-change and action reward
  normalization: none
  tactic_mapping_dependency: false
  components:
    invalid_action:
      trigger: failed action precondition
      scalar: -5.0
      payment: repeatable
      novelty: false
      cve_cvss: false
      mitre: false
    stochastic_exploit_failure:
      trigger: exploit random draw exceeds probability
      scalar: -5.0
      payment: repeatable
      novelty: false
      cve_cvss: false
      mitre: false
    no_state_change:
      trigger: successful valid action leaves AgentKnowledge snapshot unchanged
      scalar: -1.0
      payment: repeatable
      novelty: false
      cve_cvss: false
      mitre: false
    information_state_change:
      trigger: discover_network, enumerate_host, enumerate_service, enumerate_application or assess_vulnerability changes AgentKnowledge
      scalar: 1.0
      payment: once per action-kind and entity per episode
      novelty: AgentKnowledge snapshot including enumerated/assessed markers, not new-node count
      cve_cvss: false
      mitre: false
    exploit:
      trigger: successful exploit changes AgentKnowledge
      formula: 0.5 + synthetic_cvss / 10.0
      payment: once per access target per episode
      novelty: true
      cve_cvss: true
      mitre: false
    obtain_credential:
      trigger: successful credential acquisition changes AgentKnowledge
      scalar: 2.0
      payment: once per credential per episode
      novelty: true
      cve_cvss: false
      mitre: false
    authenticate:
      trigger: successful authentication changes AgentKnowledge
      scalar: 3.0
      payment: once per access target per episode
      novelty: true
      cve_cvss: false
      mitre: false
    pivot:
      trigger: successful pivot changes AgentKnowledge
      scalar: 3.0
      payment: once per access target per episode
      novelty: true
      cve_cvss: false
      mitre: false
    escalate_privilege:
      trigger: user-to-root transition with known root vulnerability
      scalar: 4.0
      payment: once per target per episode
      novelty: true
      cve_cvss: requires known privilege vulnerability; no CVSS weighting
      mitre: false
    objective:
      trigger: successful access_asset to a crown jewel changes AgentKnowledge
      scalar: 100.0
      payment: once per crown jewel; terminates episode on first objective
      novelty: true
      cve_cvss: false
      mitre: false
    other_state_change:
      trigger: valid changed action not matched above
      scalar: 0.0
      payment: per valid changed action
      novelty: true
      cve_cvss: false
      mitre: false
discovery_semantics:
  version: agentknowledge-set-and-snapshot-v1
  count: cardinality of AgentKnowledge.discovered
  repeated_discovery: no new set members and no repeated valid discovery payment
  caveat: first enumeration/assessment can earn information-state reward with zero newly discovered nodes
outcomes:
  primary: zero-shot success rate on final unseen topology seeds
  success: terminated by nonempty intersection of accessed_assets and crown_jewels
  aggregation: equally weighted topology episodes within training seed; report all ten seeds
  efficiency: mean steps-to-success among successful episodes only; null when no successes
  supporting: [environment_return, failed_actions]
  descriptive: [per_topology_success, per_training_seed_success, episode_length]
evaluation:
  deterministic: true
  evaluation_episode_seeds: [19001]
  validation_schedule: after each fixed-budget training run; descriptive only, no model selection or tuning
  final_test_schedule: only after all ten fixed-budget policies and configuration are frozen; separately invoked
  final_test_authorized_now: false
  policy_updates: false
  policy_hash_before_after_required: true
  checkpoint_choice: terminal fixed-budget checkpoint
convergence:
  version: distribution-return-diagnostic-v1-draft
  decision_role: descriptive per-seed post-training diagnosis; never early stopping or seed exclusion
  episode_window: 100
  minimum_completed_episodes: 600
  rise: last-300 episode mean minus first-100 mean >= max(5, 0.10 * abs(first-100 mean))
  stability: range of last three disjoint 100-episode means <= max(5, 0.10 * abs(last-300 mean))
  late_collapse: last-100 mean below best complete 100-episode block mean by more than max(5, 0.20 * abs(best mean))
  diagnostics: all recorded non-missing values finite; required final values present
  required_diagnostics: [approx_kl, clip_fraction, explained_variance, entropy_loss, policy_gradient_loss, value_loss]
  ten_seed_rule: report each seed, number passing, and all failures; do not replace or discard seeds
  validation_stability_claim: false
  final_test_access: false

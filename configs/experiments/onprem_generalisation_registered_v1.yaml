    affected_tactic_recon_fraction_precision: approximate; supplied brief, not independently located in local audit
    source: docs/CONFIRMATORY_DISCOVERY_COUNT_V3.md
safety:
  simulation_only: true
  live_collection: false
  digital_twin_input: false
  postgres_required: false

